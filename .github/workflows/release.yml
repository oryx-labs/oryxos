name: Release

# Trigger only on version tags. Creating a GitHub Release + GHCR/Helm artifacts.
# Do NOT trigger on pull_request closed: that left SKIPPED check runs on every
# non-release merge (skipped ≠ pass for the all-success bar).
# After merging a release PR, push tag vX.Y.Z (matching pom version) to publish.
on:
  push:
    tags:
      - 'v*'

# 创建 Release + tag 需要写 contents 权限；推镜像到 GHCR 需要写 packages 权限
permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve version from tag / pom.xml
        id: ver
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          RAW=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ -z "$RAW" ] || [ "$RAW" = "null object or invalid expression" ]; then
            echo "::error::无法从 pom.xml 解析版本号"
            exit 1
          fi
          # 剥离开发用 -SNAPSHOT 后缀；-RELEASE 等正式标签原样保留
          VERSION="${RAW%-SNAPSHOT}"
          EXPECTED="v${VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag ${TAG_NAME} 与 pom 版本不符（期望 ${EXPECTED}）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "解析到版本：$VERSION（tag $TAG_NAME）"

      - name: Build release tarball (make release)
        run: make release

      - name: Verify artifact exists
        run: |
          TARBALL="dist/oryxos-${{ steps.ver.outputs.version }}.tar.gz"
          test -f "$TARBALL" || { echo "::error::未找到 $TARBALL"; exit 1; }
          ls -la "$TARBALL"

      - name: Create GitHub Release & upload tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          TARBALL="dist/oryxos-${VERSION}.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传产物。"
            gh release upload "$TAG" "$TARBALL" --clobber
          else
            gh release create "$TAG" "$TARBALL" \
              --target "$TARGET_SHA" \
              --title "OryxOS ${VERSION}" \
              --notes "Automated release from tag ${TAG}" \
              --generate-notes
          fi
          echo "已发布 $TAG，产物：$(basename "$TARBALL")"

      # ── 容器镜像（纯增量）：tar.gz 之后的第二种产物，推到 GHCR ──
      # jar 平台无关（镜像内不跑 Maven）：amd64 runner 原生构建 jar 一次，
      # buildx 双架构只是各自拉基础镜像 + COPY jar，无需 QEMU 跑 Maven。
      # 顺序刻意放在 tar.gz Release 之后：镜像失败不阻塞既有的 tar.gz 发版。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & push multi-arch image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/oryxos
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:v${VERSION}" \
            --tag "${IMAGE}:latest" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .
          echo "已推送 ${IMAGE}:v${VERSION} 与 :latest（linux/amd64 + linux/arm64）"

      # ── 039：Helm chart 第三种产物——打包 tgz 追加到同一 Release 附件（appVersion 对齐 pom 版本）。
      # 顺序放在镜像之后：chart 失败不阻塞 tar.gz 与镜像发版；不做 OCI chart 仓库（YAGNI，R8）。
      - name: Package & upload Helm chart
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/install-k8s-tools.sh gate
          export PATH="$HOME/bin:$PATH"
          helm package charts/oryxos --app-version "${VERSION}-RELEASE" -d dist/
          gh release upload "v${VERSION}" dist/oryxos-*.tgz --clobber
          echo "已上传 chart 附件到 Release v${VERSION}"
