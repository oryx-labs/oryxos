# Independent secret scan for #453 — kept outside ci.yml so markdown/docs
# changes are still scanned (ci.yml paths-ignore would skip them).
name: Secret scan

on:
  push:
    branches: [main, 'week-*', 'dev-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history: secrets removed in a later commit are still a leak.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pin the CLI (not gitleaks-action) so org repos need no GITLEAKS_LICENSE.
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan git history
        run: gitleaks detect --source . --verbose --redact --no-banner
