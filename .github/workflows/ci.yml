name: CI

on:
  push:
    branches: [main, 'week-*', 'dev-*']
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'docs/**'

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# One run per PR / branch; cancel superseded pushes to save runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Long-lived PRs fail OWASP when main adds CVE suppressions they have not merged.
  # Fail fast if those files lag the PR base; other drift is still the author's call.
  owasp-baseline:
    name: OWASP baseline vs main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare suppressions and root POM to base
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          if git merge-base --is-ancestor "$base" HEAD; then
            echo "Branch already contains $base."
            exit 0
          fi
          echo "Branch is $(git rev-list --count HEAD.."$base") commit(s) behind $base."
          changed=0
          for f in config/dependency-check-suppressions.xml pom.xml; do
            if ! git diff --quiet "$base" -- "$f"; then
              echo "::error file=$f::$f differs from ${{ github.base_ref }}. Merge main so OWASP suppressions stay in sync."
              git --no-pager diff --stat "$base" -- "$f"
              changed=1
            fi
          done
          if [ "$changed" -ne 0 ]; then
            echo "Run: make sync-upstream && mvn -B verify"
            exit 1
          fi
          echo "Behind main, but OWASP/pom baseline files match."

  build:
    name: Build & quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Full quality gate: spotless → checkstyle → compile → test → pmd/p3c →
      # spotbugs+findsecbugs. Any violation fails the job.
      - name: mvn verify
        run: mvn -B clean verify

  dependency-check:
    name: OWASP Dependency-Check (CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # upload-artifact
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Package only (skip quality plugins already covered by `build`), then run
      # Dependency-Check aggregate. Avoids a second spotless/pmd/spotbugs pass
      # that duplicated ~half the CI time and made CVE failures hard to spot.
      # NVD feed uses Dependency-Check's nightly cache (no NVD API key for forks).
      - name: package (skip quality plugins)
        run: >-
          mvn -B clean package -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: OWASP dependency-check aggregate
        run: mvn -B -Dowasp.skip=false org.owasp:dependency-check-maven:aggregate
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore

  docker-build:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 只验证镜像可构建（Dockerfile + 上下文不腐烂），不推送；
      # 测试与质量门禁已在 build job 覆盖，这里跳过以省时
      - name: package (skip tests & quality plugins)
        run: >-
          mvn -B clean package -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: docker build
        run: docker build -t oryxos:ci .
