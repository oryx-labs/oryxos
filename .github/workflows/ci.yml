name: CI

on:
  push:
    branches: [main, 'week-*', 'dev-*']
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'docs/**'

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# One run per PR / branch; cancel superseded pushes to save runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Long-lived PRs fail OWASP when main adds CVE suppressions they have not merged.
  # Fail fast if those files lag the PR base; other drift is still the author's call.
  # On push to main (and other push branches): compare against the previous SHA so the
  # job always runs (skipped ≠ pass for the all-success bar).
  owasp-baseline:
    name: OWASP baseline vs main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare suppressions and root POM to base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zeros="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            base="origin/${BASE_REF}"
            base_label="$BASE_REF"
          else
            before="${BEFORE_SHA:-}"
            if [ -z "$before" ] || [ "$before" = "$zeros" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                before="$(git rev-parse HEAD~1)"
              else
                echo "No previous commit available; nothing to compare."
                exit 0
              fi
            fi
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$before" 2>/dev/null || true
            fi
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                before="$(git rev-parse HEAD~1)"
              else
                echo "Previous SHA unavailable; nothing to compare."
                exit 0
              fi
            fi
            base="$before"
            base_label="$before"
          fi
          if git merge-base --is-ancestor "$base" HEAD; then
            echo "Branch already contains $base_label."
            exit 0
          fi
          echo "Branch is $(git rev-list --count HEAD.."$base") commit(s) behind $base_label."
          changed=0
          for f in config/dependency-check-suppressions.xml pom.xml; do
            if ! git diff --quiet "$base" -- "$f"; then
              echo "::error file=$f::$f differs from ${base_label}. Merge main so OWASP suppressions stay in sync."
              git --no-pager diff --stat "$base" -- "$f"
              changed=1
            fi
          done
          if [ "$changed" -ne 0 ]; then
            echo "Run: make sync-upstream && mvn -B verify"
            exit 1
          fi
          echo "Behind $base_label, but OWASP/pom baseline files match."

  build:
    name: Build & quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write # upload-artifact (jacoco aggregate HTML/XML)
      checks: write # dorny/test-reporter check run
      pull-requests: write # dorny/test-reporter PR annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Full quality gate: spotless → checkstyle → compile → test → pmd/p3c →
      # spotbugs+findsecbugs → JaCoCo report/check. Any violation fails the job.
      - name: mvn verify
        run: mvn -B clean verify
      # #453：PR / Checks 上展示 Surefire（及 Failsafe 若存在）JUnit XML
      - name: Publish Surefire / Failsafe test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Surefire Tests
          # TEST-*.xml 避免匹配 failsafe-summary.xml（非 JUnit）
          path: "**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-empty: "false"
      # Artifact for test-report.yml (workflow_run): fork PRs get read-only
      # GITHUB_TOKEN, so Checks must be published from a base-repo workflow.
      - name: Upload Surefire / Failsafe JUnit XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-junit-xml
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload JaCoCo aggregate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-aggregate
          path: |
            oryxos-boot/target/site/jacoco-aggregate/
          if-no-files-found: ignore
          retention-days: 14

  dependency-check:
    name: OWASP Dependency-Check (CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # upload-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Install this reactor before aggregation so cached first-party jars cannot
      # substitute an older frontend bundle during dependency resolution.
      # Skip quality plugins already covered by `build`, then run
      # Dependency-Check aggregate. Avoids a second spotless/pmd/spotbugs pass
      # that duplicated ~half the CI time and made CVE failures hard to spot.
      # NVD feed uses Dependency-Check's nightly cache (no NVD API key for forks).
      - name: install current reactor (skip quality plugins)
        run: >-
          mvn -B clean install -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: Verify security exclusion assumptions
        run: |
          python3 scripts/test-security-assumptions.py
          mkdir -p target
          mvn -B -pl oryxos-boot -am dependency:tree -Dscope=runtime > target/security-dependency-tree.txt
          python3 scripts/check-security-assumptions.py --dependency-tree target/security-dependency-tree.txt
      - name: OWASP dependency-check aggregate
        run: mvn -B -Dowasp.skip=false org.owasp:dependency-check-maven:aggregate
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore

  docker-build:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 只验证镜像可构建（Dockerfile + 上下文不腐烂），不推送；
      # 测试与质量门禁已在 build job 覆盖，这里跳过以省时
      - name: package (skip tests & quality plugins)
        run: >-
          mvn -B clean package -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: docker build
        run: docker build -t oryxos:ci .

  # #453：对 CI 镜像跑 Trivy（CRITICAL 门禁 + HIGH 报告）。
  # 自包含 package+build（与 helm 同模式）：跨 job 传本地镜像需 artifact，体积大且易碎。
  trivy-image:
    name: Trivy container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write # SARIF → code scanning
      actions: write # upload-artifact fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: package (skip tests & quality plugins)
        run: >-
          mvn -B clean package -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: docker build
        run: docker build -t oryxos:ci .
      # Report CRITICAL+HIGH in the job log (non-blocking).
      - name: Trivy report (CRITICAL+HIGH table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oryxos:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      # SARIF for GitHub code scanning / artifact (non-blocking).
      - name: Trivy SARIF (CRITICAL+HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oryxos:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '0'
          skip-setup-trivy: true
      - name: Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore
      # Gate: fail the job only on CRITICAL findings.
      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: oryxos:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  # #453：独立 CycloneDX aggregate SBOM（不拖慢 build 关键路径）。
  # 生成失败 fail-closed；SBOM 本身不含 advisory 门禁（CVE 仍由 OWASP/Trivy 负责）。
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # upload-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Install reactor so makeAggregateBom resolves first-party modules.
      # Skip quality plugins already covered by `build`.
      - name: install current reactor (skip tests & quality)
        run: >-
          mvn -B clean install -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: Generate CycloneDX aggregate BOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error

  integration-tests:
    name: Integration tests (*IT, embedded PG)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # upload-artifact (IT JUnit XML)
      checks: write # dorny/test-reporter check run
      pull-requests: write # dorny/test-reporter PR annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # #453：boot 模块的 *IT（双副本恰好一次 / 文件面可见性 / 故障接管 / 迁移演进等，zonky 嵌入式 PG）
      # 不在 surefire 默认 include，此前从不进门禁——曾漏检两处基线失败（039 落卷有案）。
      # 本 job 显式纳管；@Tag("integration")（真 key / 外部实例 / 重复整机）维持排除，
      # LiveApiIT 探活失败自动跳过。独立 job 不拖慢本地 mvn verify。
      - name: install modules (skip tests & quality)
        run: >-
          mvn -B clean install -DskipTests
          -Dspotless.check.skip=true -Dcheckstyle.skip=true
          -Dpmd.skip=true -Dspotbugs.skip=true
      - name: run boot *IT
        run: >-
          mvn -B -pl oryxos-boot test -Dtest='*IT'
          -DexcludedGroups=integration
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dspotless.check.skip=true -Dcheckstyle.skip=true
          -Dpmd.skip=true -Dspotbugs.skip=true
      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Integration Tests (*IT)
          path: "**/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-empty: "false"
      - name: Upload IT JUnit XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-it-junit-xml
          path: "**/target/surefire-reports/TEST-*.xml"
          if-no-files-found: ignore
          retention-days: 7

  helm:
    name: Helm chart lint + kind install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 039 门禁档：lint + template + kubeconform + 结构断言（无集群面）
      - name: install helm & kubeconform
        run: bash scripts/install-k8s-tools.sh gate
      - name: helm verify (lint/template/schema/assertions)
        run: bash scripts/helm-verify.sh
      # 039 门禁档（analyze C1）：CI runner 自带 docker——kind 安装冒烟属可自动化面。
      # 构建镜像 → kind load → 附带 PG → helm install → 双副本就绪 + 实例双活断言（SC-001 自动化）
      - name: package jar
        run: >-
          mvn -B clean package -DskipTests
          -Dspotless.check.skip=true -Dcheckstyle.skip=true
          -Dpmd.skip=true -Dspotbugs.skip=true
      - name: docker build
        run: docker build --build-arg JAR_FILE=oryxos-boot/target/oryxos-boot-*.jar -t oryxos:ci .
      - name: create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: oryxos-ci
      - name: kind install smoke
        run: bash scripts/kind-smoke.sh oryxos:ci
