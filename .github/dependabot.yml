version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(maven)"
    groups:
      # Routine upgrades share one PR; major upgrades stay separate for migration review.
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # PMD 7.28.0 aborts inside its own NonThreadSafeSingleton rule
      # (NodeStream.firstOrThrow), so maven-pmd-plugin fails the quality gate while
      # all 750 tests and Checkstyle pass. 7.28.0 changed that rule to also report
      # non-static methods (pmd/pmd#6780). Only that release is held back, so a fixed
      # 7.28.x still upgrades automatically.
      - dependency-name: "net.sourceforge.pmd:pmd-core"
        versions: ["7.28.0"]
      - dependency-name: "net.sourceforge.pmd:pmd-java"
        versions: ["7.28.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      # Routine Action upgrades share one PR; major upgrades stay separate for migration review.
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(website)"
    groups:
      # Keep the deployed documentation site current without mixing major migrations.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
