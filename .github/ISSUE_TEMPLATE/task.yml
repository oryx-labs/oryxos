name: Maintenance task
description: Propose a bounded maintenance or engineering task.
title: "[task] "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this task achieve?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and affected area
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
