spring:
  application:
    name: oryxos
  # Principle 2: disable Spring AI's eager auto-configuration. The Provider module wires
  # each ChatModel explicitly (provider name -> ChatModel map); models must not be
  # auto-instantiated at startup (which would also demand API keys before any agent runs).
  autoconfigure:
    exclude:
      # 宪法 II：禁用 Spring AI eager 模型自动装配。deepseek 走 spring-ai-openai starter，
      # OpenAiAutoConfiguration 会急切建 OpenAiChatModel 并索要 spring.ai.openai.api-key；
      # OryxOS 不用它（Provider 由 ProviderChatModelFactory 显式构造），排掉后 serve 只需 DEEPSEEK_API_KEY。
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:oryxos.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      data-source-properties:
        journal_mode: WAL
        busy_timeout: 5000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 宪法 VIII：表结构唯一权威是 db/migration/{vendor} 迁移目录（025 起 Flyway 管理）；
      # create-drop 会在重启时毁掉全部数据（18 节纠正）
      ddl-auto: none
    show-sql: false
  # 025-pluggable-storage：表结构收编 Flyway。{vendor} 按 datasource url 自动展开
  # （sqlite / postgresql）；baseline-version=0 让存量库与新库走同一条幂等迁移序列
  # V1~V5（V1 = 原 schema.sql，V2~V5 = 原四个手工升级类的平移），零 baseline 分叉。
  flyway:
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
    baseline-version: 0
  lifecycle:
    # SmartLifecycle 停机阶段限时（默认 30s）：个别阶段卡住（如 executor「运行中任务数」不归零，
    # #332 同类）时最多等 10s 就继续。注：destroy-method 回调不受此约束，长连接类资源须各自限时关闭
    # （飞书渠道 WS close 限时见 FeishuChannelAdapter.closeQuietly）。
    timeout-per-shutdown-phase: 10s

server:
  port: 8080
  # 反向代理（nginx/caddy 终止 TLS）下识别 X-Forwarded-Proto/Host/Port：
  # 没有它 request.isSecure() 恒为 false，登录 cookie 不会带 Secure 属性。
  # 直连部署无副作用（无 X-Forwarded-* 头时行为不变）。
  forward-headers-strategy: framework

# Sandbox 白名单（第 24 节 WhitelistSandbox；宪法 VI 第一档：应用层校验）。
# 三块各自独立；**空列表 = 该类什么都不允许（deny-all）**，绝非"不校验"——按最小权限收窄。
# 文件路径支持相对/绝对（运行时归一为绝对再比对，挡相对路径穿越）；域名 *. 通配带点号边界（不被形似域名绕过）。
file:
  allowed_paths:
    - .oryxos          # Agent 工作区（Profile/记忆/技能/日志）
shell:
  allowed_commands:    # 精确可执行文件白名单；解释器条目授予模型当前系统用户的代码执行权限，不提供隔离
    - ls
    - cat
    - echo
    - grep
    # 解释器（python/python3 等）刻意不入默认白名单：bash -c 执行下是任意代码执行入口。
    # 确需跑脚本的 Agent 请在部署配置里显式加入并自担风险。
http:
  allowed_domains:
    - api.deepseek.com      # Provider 端点（精确匹配）
    - "*.feishu.cn"         # 飞书 webhook + SDK（open.feishu.cn）
    - openws.work.weixin.qq.com # 企微智能机器人长连接入站
    - qyapi.weixin.qq.com   # 企微群机器人 webhook 通知
    - api.dingtalk.com      # 钉钉 Stream 网关（开连接）
    - oapi.dingtalk.com     # 钉钉 webhook 通知 + sessionWebhook 回复
    - slack.com             # Slack Web API（connections.open / chat.postMessage）
    - "*.slack.com"         # Slack Socket Mode WSS（wss-primary / wss-backup 等）
    - discord.com           # Discord REST API（发消息）
    - gateway.discord.gg    # Discord Gateway WSS
    - cdn.discordapp.com    # Discord 入站附件 CDN
    - media.discordapp.net  # Discord 入站媒体代理
    - "*.discordapp.com"    # Discord CDN 子域
    - "*.discordapp.net"    # Discord 媒体子域
    - api.open-meteo.com    # 天气 Agent（免 key 天气源，31 节 Demo 一）
    - hn.algolia.com        # 科技日报 Agent 新闻源（免 key JSON，31 节 Demo 二）
    - api.github.com        # GitHub 日报脚本走子进程网络；列此便于审计与将来收口（31 节 Demo 三 §信任边界）

# 长期记忆后端（第 22 节可插拔）：markdown（默认，零依赖）| sqlite（结构化）| mem0（自托管外部服务）
memory:
  backend: markdown
  mem0:
    base-url: ${MEM0_BASE_URL:}   # 仅 backend=mem0 时使用；自托管实例，走环境变量不落明文
    user-id: ${MEM0_USER_ID:oryxos}

# Provider 清单（宪法 III 显式映射的数据源；凭证走环境变量占位，缺失时启动校验点名报错）
oryxos:
  providers:
    - name: deepseek
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
  # 「用大模型生成 Agent 草稿」(generateFiles) 调 LLM 时用的作者模型；provider 缺省取 providers 第一个。
  # model 留空则生成端点返回可读的 503（不向 OpenAI 兼容端点发 model=null）。
  author:
    provider: deepseek
    model: deepseek-v4-flash
  # 管理台 Basic Auth（012-web-auth）。默认关=假设内网现状不变（SC-001）；
  # 开启后 /admin/** 需账密，/api/v1/** 不受影响（REST 不做 Basic Auth）。
  # 开启前先 oryxos user add <username> 建账号，否则启动阻断（FR-006）。
  web:
    auth:
      enabled: false
      realm: OryxOS

# Observability: Actuator + Micrometer/Prometheus
# /actuator/** 由 ApiKeyAuthFilter 保护（API Key 或管理台 session），health 探活子树豁免；
# prometheus/metrics/info 无凭据一律 401，避免运行时与业务指标匿名泄露。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # 匿名探活只看聚合 UP/DOWN；组件/数据源/磁盘等详情需认证（when-authorized）
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: oryxos

# OpenAPI / Swagger UI
# 默认关闭：接口模型不向网络暴露。本地调试可临时开启：
#   --springdoc.api-docs.enabled=true --springdoc.swagger-ui.enabled=true
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

# Log levels (formatting/appenders live in logback-spring.xml)
logging:
  level:
    root: INFO
    io.oryxos: DEBUG
