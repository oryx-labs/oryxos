<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300">
  <defs>
    <filter id="fg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="rgba(249,115,22,0.4)"/>
    </filter>
  </defs>

  <rect width="1080" height="300" fill="#0a0a0a" rx="14"/>

  <text x="540" y="34" font-family="'SF Mono','Fira Code','PingFang SC','Microsoft YaHei',monospace" font-size="13" fill="#f97316" text-anchor="middle" letter-spacing="3" font-weight="bold">AGENT 公式</text>

  <!-- md document -->
  <path d="M 48 78 L 188 78 L 212 102 L 212 202 L 48 202 Z" fill="#111" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M 188 78 L 188 102 L 212 102" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="128" y="118" font-family="'SF Mono',monospace" font-size="11" fill="#3b82f6" text-anchor="middle">AGENT.md</text>
  <text x="128" y="146" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#f5f5f5" text-anchor="middle" font-weight="bold">自然语言</text>
  <text x="128" y="168" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">一句话 · 一个 md 目录</text>
  <line x1="70" y1="182" x2="186" y2="182" stroke="#374151" stroke-width="1"/>

  <!-- plus -->
  <text x="252" y="150" font-family="'SF Mono',monospace" font-size="30" fill="#f97316" text-anchor="middle" font-weight="bold">+</text>

  <!-- capability chips 2x3 -->
  <rect x="292" y="86" width="148" height="48" rx="24" fill="#111" stroke="#a855f7" stroke-width="1.2"/>
  <text x="366" y="115" font-family="'SF Mono','PingFang SC',monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">Memory 记忆</text>

  <rect x="452" y="86" width="148" height="48" rx="24" fill="#111" stroke="#a855f7" stroke-width="1.2"/>
  <text x="526" y="115" font-family="'SF Mono','PingFang SC',monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">Tool 工具</text>

  <rect x="612" y="86" width="148" height="48" rx="24" fill="#111" stroke="#a855f7" stroke-width="1.2"/>
  <text x="686" y="115" font-family="'SF Mono','PingFang SC',monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">MCP 连接器</text>

  <rect x="292" y="146" width="148" height="48" rx="24" fill="#111" stroke="#a855f7" stroke-width="1.2"/>
  <text x="366" y="175" font-family="'SF Mono','PingFang SC',monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">Skill 技能</text>

  <rect x="452" y="146" width="148" height="48" rx="24" fill="#111" stroke="#a855f7" stroke-width="1.2"/>
  <text x="526" y="175" font-family="'SF Mono','PingFang SC',monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">知识库</text>

  <rect x="612" y="146" width="148" height="48" rx="24" fill="#111" stroke="#a855f7" stroke-width="1.2"/>
  <text x="686" y="175" font-family="'SF Mono','PingFang SC',monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">Notify 通知</text>

  <text x="526" y="222" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle">全部内置在 OS 里 · Agent 按名引用即得</text>

  <!-- equals -->
  <text x="800" y="150" font-family="'SF Mono',monospace" font-size="30" fill="#f97316" text-anchor="middle" font-weight="bold">=</text>

  <!-- Agent -->
  <rect x="840" y="82" width="204" height="116" rx="12" fill="#1a0f06" stroke="#f97316" stroke-width="2" filter="url(#fg)"/>
  <text x="942" y="122" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#f97316" text-anchor="middle" font-weight="bold">一个能干活的</text>
  <text x="942" y="150" font-family="'SF Mono',monospace" font-size="20" fill="#f5f5f5" text-anchor="middle" font-weight="bold">Agent</text>
  <text x="942" y="178" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">放进目录即上线 · 免重启</text>

  <text x="540" y="272" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">把「定义一个 Agent」的成本压到趋近于零</text>
</svg>
