<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240" width="1080" height="240">
  <defs>
    <filter id="pg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="rgba(249,115,22,0.35)"/>
    </filter>
    <marker id="pa" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="1080" height="240" fill="#0a0a0a" rx="14"/>

  <text x="540" y="34" font-family="'SF Mono','Fira Code','PingFang SC','Microsoft YaHei',monospace" font-size="13" fill="#f97316" text-anchor="middle" letter-spacing="3" font-weight="bold">一句话 → 一支 AGENT 团队 → 一个结果</text>

  <!-- Step 1: 一句话任务 -->
  <rect x="35" y="66" width="170" height="88" rx="10" fill="#111" stroke="#f97316" stroke-width="1.5" filter="url(#pg)"/>
  <text x="120" y="88" font-family="'SF Mono',monospace" font-size="9" fill="#f97316" text-anchor="middle" letter-spacing="1">01</text>
  <text x="120" y="114" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#f5f5f5" text-anchor="middle" font-weight="bold">一句话任务</text>
  <text x="120" y="138" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">用自然语言发布任务</text>

  <line x1="205" y1="110" x2="243" y2="110" stroke="#f97316" stroke-width="1.5" marker-end="url(#pa)"/>

  <!-- Step 2: 拆解 -->
  <rect x="247" y="66" width="170" height="88" rx="10" fill="#111" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="332" y="88" font-family="'SF Mono',monospace" font-size="9" fill="#3b82f6" text-anchor="middle" letter-spacing="1">02</text>
  <text x="332" y="114" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#f5f5f5" text-anchor="middle" font-weight="bold">拆解</text>
  <text x="332" y="138" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">底座理解并拆解任务</text>

  <line x1="417" y1="110" x2="455" y2="110" stroke="#f97316" stroke-width="1.5" marker-end="url(#pa)"/>

  <!-- Step 3: 组织 Agent 团队 -->
  <rect x="459" y="66" width="170" height="88" rx="10" fill="#111" stroke="#a855f7" stroke-width="1.5"/>
  <text x="544" y="88" font-family="'SF Mono',monospace" font-size="9" fill="#a855f7" text-anchor="middle" letter-spacing="1">03</text>
  <text x="544" y="114" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#f5f5f5" text-anchor="middle" font-weight="bold">组织 Agent 团队</text>
  <text x="544" y="138" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">协调者 · 专家 · 评审</text>

  <line x1="629" y1="110" x2="667" y2="110" stroke="#f97316" stroke-width="1.5" marker-end="url(#pa)"/>

  <!-- Step 4: 分工协作 -->
  <rect x="671" y="66" width="170" height="88" rx="10" fill="#111" stroke="#ec4899" stroke-width="1.5"/>
  <text x="756" y="88" font-family="'SF Mono',monospace" font-size="9" fill="#ec4899" text-anchor="middle" letter-spacing="1">04</text>
  <text x="756" y="114" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#f5f5f5" text-anchor="middle" font-weight="bold">分工协作</text>
  <text x="756" y="138" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">并行执行 · 全程审计</text>

  <line x1="841" y1="110" x2="879" y2="110" stroke="#f97316" stroke-width="1.5" marker-end="url(#pa)"/>

  <!-- Step 5: 交付结果 -->
  <rect x="883" y="66" width="170" height="88" rx="10" fill="#111" stroke="#22c55e" stroke-width="1.5" filter="url(#pg)"/>
  <text x="968" y="88" font-family="'SF Mono',monospace" font-size="9" fill="#22c55e" text-anchor="middle" letter-spacing="1">05</text>
  <text x="968" y="114" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#f5f5f5" text-anchor="middle" font-weight="bold">交付结果</text>
  <text x="968" y="138" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#9ca3af" text-anchor="middle">产出落盘 · 推送给你</text>

  <text x="540" y="204" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">私有部署 · 数据不出域 · 每一步可审计 · 危险动作有人审批</text>
</svg>
