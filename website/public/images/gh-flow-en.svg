<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 210" width="1080" height="210">
  <defs>
    <marker id="ga" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="1080" height="210" fill="#0a0a0a" rx="14"/>

  <text x="540" y="32" font-family="'SF Mono','Fira Code',monospace" font-size="12" fill="#f97316" text-anchor="middle" letter-spacing="3" font-weight="bold">FORK → BRANCH → PR → REVIEW → MERGE</text>

  <!-- 1 Fork -->
  <rect x="30" y="56" width="130" height="66" rx="10" fill="#111" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="84" font-family="'SF Mono',monospace" font-size="13" fill="#f5f5f5" text-anchor="middle" font-weight="bold">Fork</text>
  <text x="95" y="104" font-family="'SF Mono',monospace" font-size="8.5" fill="#9ca3af" text-anchor="middle">copy to your account</text>

  <line x1="160" y1="89" x2="192" y2="89" stroke="#f97316" stroke-width="1.5" marker-end="url(#ga)"/>

  <!-- 2 Branch -->
  <rect x="196" y="56" width="130" height="66" rx="10" fill="#111" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="261" y="84" font-family="'SF Mono',monospace" font-size="13" fill="#f5f5f5" text-anchor="middle" font-weight="bold">Branch</text>
  <text x="261" y="104" font-family="'SF Mono',monospace" font-size="8.5" fill="#9ca3af" text-anchor="middle">branch + write code</text>

  <line x1="326" y1="89" x2="358" y2="89" stroke="#f97316" stroke-width="1.5" marker-end="url(#ga)"/>

  <!-- 3 Push + PR -->
  <rect x="362" y="56" width="130" height="66" rx="10" fill="#111" stroke="#a855f7" stroke-width="1.5"/>
  <text x="427" y="84" font-family="'SF Mono',monospace" font-size="13" fill="#f5f5f5" text-anchor="middle" font-weight="bold">Open a PR</text>
  <text x="427" y="104" font-family="'SF Mono',monospace" font-size="8.5" fill="#9ca3af" text-anchor="middle">push · say what &amp; why</text>

  <line x1="492" y1="89" x2="524" y2="89" stroke="#f97316" stroke-width="1.5" marker-end="url(#ga)"/>

  <!-- 4 CI + Review -->
  <rect x="528" y="56" width="200" height="66" rx="10" fill="#111" stroke="#ec4899" stroke-width="1.5"/>
  <text x="628" y="84" font-family="'SF Mono',monospace" font-size="12" fill="#f5f5f5" text-anchor="middle" font-weight="bold">CI runs · review</text>
  <text x="628" y="104" font-family="'SF Mono',monospace" font-size="8.5" fill="#9ca3af" text-anchor="middle">address feedback · push updates the PR</text>

  <line x1="728" y1="89" x2="760" y2="89" stroke="#f97316" stroke-width="1.5" marker-end="url(#ga)"/>

  <!-- 5 LGTM -->
  <rect x="764" y="56" width="130" height="66" rx="10" fill="#111" stroke="#eab308" stroke-width="1.5"/>
  <text x="829" y="84" font-family="'SF Mono',monospace" font-size="13" fill="#f5f5f5" text-anchor="middle" font-weight="bold">LGTM ✓</text>
  <text x="829" y="104" font-family="'SF Mono',monospace" font-size="8.5" fill="#9ca3af" text-anchor="middle">approved</text>

  <line x1="894" y1="89" x2="926" y2="89" stroke="#f97316" stroke-width="1.5" marker-end="url(#ga)"/>

  <!-- 6 Merge -->
  <rect x="930" y="56" width="120" height="66" rx="10" fill="#0a1a0f" stroke="#22c55e" stroke-width="1.5"/>
  <text x="990" y="84" font-family="'SF Mono',monospace" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="bold">Merge 🎉</text>
  <text x="990" y="104" font-family="'SF Mono',monospace" font-size="8.5" fill="#9ca3af" text-anchor="middle">into main</text>

  <text x="540" y="168" font-family="'SF Mono',monospace" font-size="10" fill="#6b7280" text-anchor="middle">being asked to change things is normal, not a rejection — it's the fastest way to learn in open source</text>
</svg>
