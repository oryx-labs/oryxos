<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470">
  <defs>
    <filter id="tg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="rgba(249,115,22,0.35)"/>
    </filter>
    <marker id="ta" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#f97316"/>
    </marker>
    <marker id="tp" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#a855f7"/>
    </marker>
    <marker id="tk" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#ec4899"/>
    </marker>
  </defs>

  <rect width="1080" height="470" fill="#0a0a0a" rx="14"/>

  <text x="390" y="34" font-family="'SF Mono','Fira Code',monospace" font-size="13" fill="#f97316" text-anchor="middle" letter-spacing="3" font-weight="bold">HOW AN AGENT TEAM DELIVERS A TASK</text>

  <!-- Task pill -->
  <rect x="120" y="54" width="540" height="42" rx="21" fill="#1a0f06" stroke="#f97316" stroke-width="1.5" filter="url(#tg)"/>
  <text x="390" y="80" font-family="'SF Mono',monospace" font-size="11.5" fill="#f5f5f5" text-anchor="middle">"Track competitors this week, write a report, send it Friday 5pm"</text>

  <line x1="390" y1="96" x2="390" y2="126" stroke="#f97316" stroke-width="1.5" marker-end="url(#ta)"/>

  <!-- Planner -->
  <rect x="290" y="130" width="200" height="58" rx="10" fill="#111" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="154" font-family="'SF Mono',monospace" font-size="13" fill="#f5f5f5" text-anchor="middle" font-weight="bold">Planner Agent</text>
  <text x="390" y="174" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">decompose · assign · dispatch</text>

  <!-- fan-out -->
  <line x1="340" y1="188" x2="165" y2="238" stroke="#a855f7" stroke-width="1.3" marker-end="url(#tp)"/>
  <line x1="390" y1="188" x2="390" y2="238" stroke="#a855f7" stroke-width="1.3" marker-end="url(#tp)"/>
  <line x1="440" y1="188" x2="615" y2="238" stroke="#a855f7" stroke-width="1.3" marker-end="url(#tp)"/>

  <!-- Specialists -->
  <rect x="60" y="242" width="200" height="58" rx="10" fill="#111" stroke="#a855f7" stroke-width="1.5"/>
  <text x="160" y="266" font-family="'SF Mono',monospace" font-size="13" fill="#f5f5f5" text-anchor="middle" font-weight="bold">Research Agent</text>
  <text x="160" y="286" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">fetch · search · digest</text>

  <rect x="290" y="242" width="200" height="58" rx="10" fill="#111" stroke="#a855f7" stroke-width="1.5"/>
  <text x="390" y="266" font-family="'SF Mono',monospace" font-size="13" fill="#f5f5f5" text-anchor="middle" font-weight="bold">Data Agent</text>
  <text x="390" y="286" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">query · aggregate · chart</text>

  <rect x="520" y="242" width="200" height="58" rx="10" fill="#111" stroke="#a855f7" stroke-width="1.5"/>
  <text x="620" y="266" font-family="'SF Mono',monospace" font-size="13" fill="#f5f5f5" text-anchor="middle" font-weight="bold">Writer Agent</text>
  <text x="620" y="286" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">draft · format</text>

  <text x="390" y="322" font-family="'SF Mono',monospace" font-size="9" fill="#6b7280" text-anchor="middle">isolated sessions / memory / sandbox each · running in parallel</text>

  <!-- converge -->
  <line x1="160" y1="300" x2="335" y2="352" stroke="#ec4899" stroke-width="1.3" marker-end="url(#tk)"/>
  <line x1="390" y1="330" x2="390" y2="352" stroke="#ec4899" stroke-width="1.3" marker-end="url(#tk)"/>
  <line x1="620" y1="300" x2="445" y2="352" stroke="#ec4899" stroke-width="1.3" marker-end="url(#tk)"/>

  <!-- Reviewer -->
  <rect x="290" y="356" width="200" height="52" rx="10" fill="#111" stroke="#ec4899" stroke-width="1.5"/>
  <text x="390" y="378" font-family="'SF Mono',monospace" font-size="13" fill="#f5f5f5" text-anchor="middle" font-weight="bold">Reviewer Agent</text>
  <text x="390" y="398" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">merge · check · gate</text>

  <!-- deliver -->
  <line x1="490" y1="382" x2="560" y2="382" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ta)"/>
  <rect x="564" y="356" width="216" height="52" rx="26" fill="#0a1a0f" stroke="#22c55e" stroke-width="1.5"/>
  <text x="672" y="378" font-family="'SF Mono',monospace" font-size="12" fill="#22c55e" text-anchor="middle" font-weight="bold">Result delivered</text>
  <text x="672" y="397" font-family="'SF Mono',monospace" font-size="8.5" fill="#9ca3af" text-anchor="middle">lands in output/ · notify pings you</text>

  <!-- Right rail: guarantees -->
  <rect x="812" y="60" width="244" height="348" rx="10" fill="#111" stroke="#374151" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="934" y="88" font-family="'SF Mono',monospace" font-size="11" fill="#f97316" text-anchor="middle" font-weight="bold" letter-spacing="2">ENTERPRISE-GRADE TRUST</text>

  <text x="832" y="126" font-family="'SF Mono',monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="850" y="126" font-family="'SF Mono',monospace" font-size="11" fill="#e5e7eb" font-weight="bold">Fully audited</text>
  <text x="850" y="144" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af">every sub-agent's LLM + tool</text>
  <text x="850" y="160" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af">calls persisted, replayable</text>

  <text x="832" y="194" font-family="'SF Mono',monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="850" y="194" font-family="'SF Mono',monospace" font-size="11" fill="#e5e7eb" font-weight="bold">Sandbox allowlists</text>
  <text x="850" y="212" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af">files / shell / domains gated</text>
  <text x="850" y="228" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af">per agent, deny by default</text>

  <text x="832" y="262" font-family="'SF Mono',monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="850" y="262" font-family="'SF Mono',monospace" font-size="11" fill="#e5e7eb" font-weight="bold">Human approval</text>
  <text x="850" y="280" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af">outbound / spend / dangerous</text>
  <text x="850" y="296" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af">steps pause until approved</text>

  <text x="832" y="330" font-family="'SF Mono',monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="850" y="330" font-family="'SF Mono',monospace" font-size="11" fill="#e5e7eb" font-weight="bold">Bounded + costed</text>
  <text x="850" y="348" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af">iteration caps; token cost</text>
  <text x="850" y="364" font-family="'SF Mono',monospace" font-size="9" fill="#9ca3af">attributed per task</text>

  <text x="540" y="446" font-family="'SF Mono',monospace" font-size="10" fill="#6b7280" text-anchor="middle">every sub-agent is still "one directory" — same lifecycle, existing business agents or spawned ad hoc</text>
</svg>
