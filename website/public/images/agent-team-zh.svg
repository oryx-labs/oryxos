<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470">
  <defs>
    <filter id="tg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="rgba(249,115,22,0.35)"/>
    </filter>
    <marker id="ta" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#f97316"/>
    </marker>
    <marker id="tp" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#a855f7"/>
    </marker>
    <marker id="tk" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 Z" fill="#ec4899"/>
    </marker>
  </defs>

  <rect width="1080" height="470" fill="#0a0a0a" rx="14"/>

  <text x="390" y="34" font-family="'SF Mono','Fira Code','PingFang SC','Microsoft YaHei',monospace" font-size="13" fill="#f97316" text-anchor="middle" letter-spacing="3" font-weight="bold">一支 AGENT 团队怎么交付一个任务</text>

  <!-- Task pill -->
  <rect x="150" y="54" width="480" height="42" rx="21" fill="#1a0f06" stroke="#f97316" stroke-width="1.5" filter="url(#tg)"/>
  <text x="390" y="80" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#f5f5f5" text-anchor="middle">「查竞品本周动态，写一份周报，周五下午发给团队」</text>

  <line x1="390" y1="96" x2="390" y2="126" stroke="#f97316" stroke-width="1.5" marker-end="url(#ta)"/>

  <!-- Planner -->
  <rect x="290" y="130" width="200" height="58" rx="10" fill="#111" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="154" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#f5f5f5" text-anchor="middle" font-weight="bold">协调者 Agent</text>
  <text x="390" y="174" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">拆解任务 · 定分工 · 派活</text>

  <!-- fan-out -->
  <line x1="340" y1="188" x2="165" y2="238" stroke="#a855f7" stroke-width="1.3" marker-end="url(#tp)"/>
  <line x1="390" y1="188" x2="390" y2="238" stroke="#a855f7" stroke-width="1.3" marker-end="url(#tp)"/>
  <line x1="440" y1="188" x2="615" y2="238" stroke="#a855f7" stroke-width="1.3" marker-end="url(#tp)"/>

  <!-- Specialists -->
  <rect x="60" y="242" width="200" height="58" rx="10" fill="#111" stroke="#a855f7" stroke-width="1.5"/>
  <text x="160" y="266" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#f5f5f5" text-anchor="middle" font-weight="bold">调研 Agent</text>
  <text x="160" y="286" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">抓网页 · 搜信息</text>

  <rect x="290" y="242" width="200" height="58" rx="10" fill="#111" stroke="#a855f7" stroke-width="1.5"/>
  <text x="390" y="266" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#f5f5f5" text-anchor="middle" font-weight="bold">数据 Agent</text>
  <text x="390" y="286" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">取数 · 汇总 · 出图</text>

  <rect x="520" y="242" width="200" height="58" rx="10" fill="#111" stroke="#a855f7" stroke-width="1.5"/>
  <text x="620" y="266" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#f5f5f5" text-anchor="middle" font-weight="bold">写作 Agent</text>
  <text x="620" y="286" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">成稿 · 排版</text>

  <text x="390" y="322" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">各自独立会话 / 记忆 / 沙箱 · 并行执行</text>

  <!-- converge -->
  <line x1="160" y1="300" x2="335" y2="352" stroke="#ec4899" stroke-width="1.3" marker-end="url(#tk)"/>
  <line x1="390" y1="330" x2="390" y2="352" stroke="#ec4899" stroke-width="1.3" marker-end="url(#tk)"/>
  <line x1="620" y1="300" x2="445" y2="352" stroke="#ec4899" stroke-width="1.3" marker-end="url(#tk)"/>

  <!-- Reviewer -->
  <rect x="290" y="356" width="200" height="52" rx="10" fill="#111" stroke="#ec4899" stroke-width="1.5"/>
  <text x="390" y="378" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#f5f5f5" text-anchor="middle" font-weight="bold">评审 Agent</text>
  <text x="390" y="398" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">合并 · 查漏 · 把关</text>

  <!-- deliver -->
  <line x1="490" y1="382" x2="560" y2="382" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ta)"/>
  <rect x="564" y="356" width="216" height="52" rx="26" fill="#0a1a0f" stroke="#22c55e" stroke-width="1.5"/>
  <text x="672" y="378" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#22c55e" text-anchor="middle" font-weight="bold">交付结果</text>
  <text x="672" y="397" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="9.5" fill="#9ca3af" text-anchor="middle">产出落 output/ · notify 推送给你</text>

  <!-- Right rail: guarantees -->
  <rect x="812" y="60" width="244" height="348" rx="10" fill="#111" stroke="#374151" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="934" y="88" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#f97316" text-anchor="middle" font-weight="bold" letter-spacing="2">企业敢用的保障</text>

  <text x="832" y="126" font-family="'SF Mono',monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="850" y="126" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e5e7eb" font-weight="bold">全程审计</text>
  <text x="850" y="144" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af">每个子 Agent 的模型调用与</text>
  <text x="850" y="160" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af">工具执行全部落库，可回放</text>

  <text x="832" y="194" font-family="'SF Mono',monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="850" y="194" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e5e7eb" font-weight="bold">沙箱白名单</text>
  <text x="850" y="212" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af">文件 / 命令 / 域名逐 Agent</text>
  <text x="850" y="228" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af">管控，越界即拒</text>

  <text x="832" y="262" font-family="'SF Mono',monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="850" y="262" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e5e7eb" font-weight="bold">危险动作人工审批</text>
  <text x="850" y="280" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af">对外发送 / 支出 / 高危操作</text>
  <text x="850" y="296" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af">挂起等人批，批了才执行</text>

  <text x="832" y="330" font-family="'SF Mono',monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="850" y="330" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e5e7eb" font-weight="bold">有界迭代 · 成本归集</text>
  <text x="850" y="348" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af">防死循环；一次任务花了多少</text>
  <text x="850" y="364" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#9ca3af">token，一笔账看得清</text>

  <text x="540" y="446" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle">每个子 Agent 仍是「一个目录」——复用整套生命周期，现成业务 Agent 或临时组建皆可</text>
</svg>
