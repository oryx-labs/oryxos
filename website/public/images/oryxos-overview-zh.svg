<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc">
  <title id="title">OryxOS 整体架构</title>
  <desc id="desc">企业 AI 应用构建在 OryxOS 之上，OryxOS 为模型、知识、工具和企业系统提供统一 Runtime、治理以及模型路由与成本优化能力。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f97316"/></marker>
    <style>text{font-family:'PingFang SC','Microsoft YaHei',Inter,sans-serif}.title{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:12px}</style>
  </defs>
  <rect width="1080" height="610" rx="18" fill="#0b1020"/>
  <text x="540" y="42" text-anchor="middle" fill="#fb923c" class="title" letter-spacing="2">企业 AI 应用 · O R Y X O S · 企业资源</text>
  <rect x="230" y="68" width="620" height="80" rx="12" fill="#112346" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="100" text-anchor="middle" fill="#93c5fd" class="label">企业 AI 应用</text>
  <text x="540" y="126" text-anchor="middle" fill="#dbeafe" class="body">研发自动化 · 知识支持 · 工单协同 · 运维诊断</text>
  <line x1="540" y1="148" x2="540" y2="183" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="130" y="188" width="820" height="292" rx="16" fill="#1a1008" stroke="#f97316" stroke-width="2"/>
  <text x="540" y="221" text-anchor="middle" fill="#fb923c" class="title">OryxOS · Agent Harness OS</text>
  <rect x="162" y="244" width="756" height="67" rx="10" fill="#2b1909" stroke="#fb923c"/>
  <text x="540" y="272" text-anchor="middle" fill="#fdba74" class="label">Agent 与 Task Runtime</text>
  <text x="540" y="295" text-anchor="middle" fill="#fed7aa" class="small">上下文 · 记忆 · 知识 · Flow · 状态 · 交付物</text>
  <rect x="162" y="333" width="360" height="116" rx="10" fill="#17102a" stroke="#a855f7"/>
  <text x="342" y="361" text-anchor="middle" fill="#d8b4fe" class="label">治理与运行</text>
  <text x="342" y="387" text-anchor="middle" fill="#e9d5ff" class="small">身份 · 授权 · 策略 · 审批</text>
  <text x="342" y="410" text-anchor="middle" fill="#e9d5ff" class="small">沙箱 · 审计 · Trace · 评测 · 可靠性</text>
  <text x="342" y="433" text-anchor="middle" fill="#c4b5fd" class="small">治理始终属于执行的一部分</text>
  <rect x="558" y="333" width="360" height="116" rx="10" fill="#10263a" stroke="#38bdf8"/>
  <text x="738" y="361" text-anchor="middle" fill="#7dd3fc" class="label">可扩展能力</text>
  <text x="738" y="387" text-anchor="middle" fill="#d0f0ff" class="small">模型 · Tool · MCP · Skill · 渠道</text>
  <text x="738" y="410" text-anchor="middle" fill="#d0f0ff" class="small">知识库 · 企业系统 · 存储</text>
  <text x="738" y="433" text-anchor="middle" fill="#7dd3fc" class="small">应用可按需组合所需能力</text>
  <rect x="258" y="502" width="564" height="65" rx="10" fill="#2b1909" stroke="#fb923c"/>
  <text x="540" y="530" text-anchor="middle" fill="#fdba74" class="label">模型路由与成本优化</text>
  <text x="540" y="552" text-anchor="middle" fill="#fed7aa" class="small">质量 · 时延 · 可用性 · 成本 · 数据边界</text>
</svg>
