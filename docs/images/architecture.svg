<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 Z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="1000" height="710" fill="#ffffff"/>

  <text x="500" y="30" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">OryxOS System Architecture</text>
  <text x="500" y="50" font-size="11" fill="#6b7280" text-anchor="middle">One Spring Boot process runs a fleet of agents — JDK 21 · virtual threads · single executable JAR</text>

  <!-- ════ callers (top) ════ -->
  <rect x="230" y="64" width="220" height="48" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="340" y="85" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Developers</text>
  <text x="340" y="101" font-size="9" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">oryxos chat · 12 CLI commands</text>

  <rect x="550" y="64" width="220" height="48" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="660" y="85" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Business Systems</text>
  <text x="660" y="101" font-size="9" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">HTTP /api/v1/…</text>

  <line x1="340" y1="112" x2="340" y2="144" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <line x1="660" y1="112" x2="660" y2="144" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>

  <!-- ════ process boundary ════ -->
  <rect x="52" y="130" width="896" height="474" rx="16" fill="#fffdf8" stroke="#fdba74" stroke-width="1.2" stroke-dasharray="7,5"/>
  <text x="928" y="154" font-size="10" font-weight="bold" fill="#fb923c" text-anchor="end" letter-spacing="3">O R Y X O S</text>

  <!-- ── Layer 1: ACCESS ── -->
  <rect x="180" y="148" width="640" height="96" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <circle cx="204" cy="166" r="11" fill="#3b82f6"/>
  <text x="204" y="170" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="224" y="170" font-size="10" font-weight="bold" fill="#1d4ed8" letter-spacing="0.5">ACCESS LAYER · oryxos-channel-cli + oryxos-web</text>
  <rect x="194" y="184" width="300" height="46" rx="5" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="344" y="204" font-size="10.5" font-weight="bold" fill="#1e40af" text-anchor="middle">CLI Channel</text>
  <text x="344" y="220" font-size="8.5" fill="#3b82f6" text-anchor="middle">interactive chat · single-message mode</text>
  <rect x="506" y="184" width="300" height="46" rx="5" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="656" y="204" font-size="10.5" font-weight="bold" fill="#1e40af" text-anchor="middle">Web Service</text>
  <text x="656" y="220" font-size="8.5" fill="#3b82f6" text-anchor="middle">10 REST endpoints · Spring MVC + virtual threads</text>

  <line x1="500" y1="244" x2="500" y2="258" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ── Layer 2: ENGINE ── -->
  <rect x="180" y="262" width="640" height="96" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <circle cx="204" cy="280" r="11" fill="#ea580c"/>
  <text x="204" y="284" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="224" y="284" font-size="10" font-weight="bold" fill="#c2410c" letter-spacing="0.5">ENGINE LAYER · oryxos-core — self-implemented ReAct loop</text>
  <rect x="194" y="298" width="196" height="46" rx="5" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
  <text x="292" y="318" font-size="10.5" font-weight="bold" fill="#c2410c" text-anchor="middle">ReActLoop</text>
  <text x="292" y="334" font-size="8.5" fill="#9a3412" text-anchor="middle">Reason → Act · iteration guard</text>
  <rect x="402" y="298" width="196" height="46" rx="5" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
  <text x="500" y="318" font-size="10.5" font-weight="bold" fill="#c2410c" text-anchor="middle">PromptBuilder</text>
  <text x="500" y="334" font-size="8.5" fill="#9a3412" text-anchor="middle">system · memory · history · tools</text>
  <rect x="610" y="298" width="196" height="46" rx="5" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
  <text x="708" y="318" font-size="10.5" font-weight="bold" fill="#c2410c" text-anchor="middle">ToolExecutor</text>
  <text x="708" y="334" font-size="8.5" fill="#9a3412" text-anchor="middle">sandbox check first · writes audit</text>

  <line x1="500" y1="358" x2="500" y2="372" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="512" y="368" font-size="8.5" fill="#9ca3af">every iteration</text>

  <!-- ── Layer 3: CAPABILITIES ── -->
  <rect x="180" y="376" width="640" height="96" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
  <circle cx="204" cy="394" r="11" fill="#9333ea"/>
  <text x="204" y="398" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="224" y="398" font-size="10" font-weight="bold" fill="#7e22ce" letter-spacing="0.5">CAPABILITY LAYER · provider + memory + tool</text>
  <rect x="194" y="412" width="196" height="46" rx="5" fill="#f3e8ff" stroke="#c084fc" stroke-width="1"/>
  <text x="292" y="430" font-size="10.5" font-weight="bold" fill="#7e22ce" text-anchor="middle">Provider</text>
  <text x="292" y="444" font-size="8" fill="#6b21a8" text-anchor="middle">Spring AI Alibaba</text>
  <text x="292" y="455" font-size="8" fill="#6b21a8" text-anchor="middle">explicit name → model map</text>
  <rect x="402" y="412" width="196" height="46" rx="5" fill="#f3e8ff" stroke="#c084fc" stroke-width="1"/>
  <text x="500" y="430" font-size="10.5" font-weight="bold" fill="#7e22ce" text-anchor="middle">Memory</text>
  <text x="500" y="444" font-size="8" fill="#6b21a8" text-anchor="middle">MemoryService facade</text>
  <text x="500" y="455" font-size="8" fill="#6b21a8" text-anchor="middle">session + MEMORY.md</text>
  <rect x="610" y="412" width="196" height="46" rx="5" fill="#f3e8ff" stroke="#c084fc" stroke-width="1"/>
  <text x="708" y="430" font-size="10.5" font-weight="bold" fill="#7e22ce" text-anchor="middle">Tool System</text>
  <text x="708" y="444" font-size="8" fill="#6b21a8" text-anchor="middle">OryxTool registry</text>
  <text x="708" y="455" font-size="8" fill="#6b21a8" text-anchor="middle">builtin · @Tool · MCP client</text>

  <line x1="500" y1="472" x2="500" y2="486" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ── Layer 4: STATE ── -->
  <rect x="180" y="490" width="640" height="96" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <circle cx="204" cy="508" r="11" fill="#16a34a"/>
  <text x="204" y="512" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="224" y="512" font-size="10" font-weight="bold" fill="#15803d" letter-spacing="0.5">STATE LAYER · oryxos-storage</text>
  <rect x="194" y="526" width="300" height="46" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="344" y="546" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">SQLite (oryxos.db)</text>
  <text x="344" y="562" font-size="8.5" fill="#15803d" text-anchor="middle">sessions · tool_invocations · llm_calls — audit from day one</text>
  <rect x="506" y="526" width="300" height="46" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="656" y="546" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">Filesystem (.oryxos/)</text>
  <text x="656" y="562" font-size="8.5" fill="#15803d" text-anchor="middle">profiles · skills · MEMORY.md · AGENTS / SOUL / USER.md</text>

  <!-- ════ external: LLM providers (left) ════ -->
  <rect x="6" y="386" width="148" height="80" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="80" y="406" font-size="9.5" font-weight="bold" fill="#374151" text-anchor="middle">LLM PROVIDERS</text>
  <text x="80" y="426" font-size="8.5" fill="#6b7280" text-anchor="middle">DeepSeek · Qwen · Kimi</text>
  <text x="80" y="440" font-size="8.5" fill="#6b7280" text-anchor="middle">OpenAI · Anthropic · Ollama</text>
  <text x="80" y="458" font-size="8" fill="#9ca3af" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">via Spring AI</text>
  <line x1="154" y1="426" x2="178" y2="426" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="166" y="418" font-size="8" fill="#7e22ce" text-anchor="middle">API</text>

  <!-- ════ external: MCP servers (right) ════ -->
  <rect x="846" y="386" width="148" height="80" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="920" y="406" font-size="9.5" font-weight="bold" fill="#374151" text-anchor="middle">MCP SERVERS</text>
  <text x="920" y="426" font-size="8.5" fill="#6b7280" text-anchor="middle">github-mcp · jira-mcp</text>
  <text x="920" y="440" font-size="8.5" fill="#6b7280" text-anchor="middle">custom · any language</text>
  <text x="920" y="458" font-size="8" fill="#9ca3af" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">JSON-RPC standard</text>
  <line x1="846" y1="426" x2="822" y2="426" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-purple)"/>
  <text x="834" y="418" font-size="8" fill="#7e22ce" text-anchor="middle">JSON-RPC</text>

  <!-- ════ design points ════ -->
  <rect x="116" y="624" width="240" height="32" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="132" cy="640" r="4" fill="#ea580c"/>
  <text x="142" y="644" font-size="9" fill="#4b5563">Whitelist sandbox on every tool call</text>
  <rect x="380" y="624" width="240" height="32" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="396" cy="640" r="4" fill="#16a34a"/>
  <text x="406" y="644" font-size="9" fill="#4b5563">Audit tables written from day one</text>
  <rect x="644" y="624" width="240" height="32" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="660" cy="640" r="4" fill="#3b82f6"/>
  <text x="670" y="644" font-size="9" fill="#4b5563">Credentials via environment variables</text>

  <text x="500" y="688" font-size="8.5" fill="#9ca3af" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">maven multi-module · single executable JAR · stateless by design — ready for distributed deployment</text>
</svg>
