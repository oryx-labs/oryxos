<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="960" height="450" fill="#ffffff"/>

  <text x="480" y="30" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">OryxOS ReAct Loop</text>
  <text x="480" y="50" font-size="11" fill="#6b7280" text-anchor="middle">Reason + Act — the self-implemented agent engine (oryxos-core)</text>

  <!-- ════ main flow (left → right) ════ -->
  <rect x="24" y="98" width="110" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="79" y="132" font-size="10.5" font-weight="bold" fill="#1e40af" text-anchor="middle">User message</text>
  <line x1="134" y1="128" x2="156" y2="128" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="158" y="98" width="120" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="218" y="124" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">Session history</text>
  <text x="218" y="141" font-size="8.5" fill="#3b82f6" text-anchor="middle">append user message</text>
  <line x1="278" y1="128" x2="300" y2="128" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="302" y="98" width="150" height="60" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.2"/>
  <text x="377" y="122" font-size="10" font-weight="bold" fill="#c2410c" text-anchor="middle">PromptBuilder</text>
  <text x="377" y="138" font-size="8.5" fill="#9a3412" text-anchor="middle">system · memory</text>
  <text x="377" y="151" font-size="8.5" fill="#9a3412" text-anchor="middle">history · tools</text>
  <line x1="452" y1="128" x2="474" y2="128" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="476" y="98" width="130" height="60" rx="8" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.2"/>
  <text x="541" y="122" font-size="10" font-weight="bold" fill="#7e22ce" text-anchor="middle">LLM call</text>
  <text x="541" y="138" font-size="8.5" fill="#6b21a8" text-anchor="middle">via Provider (Spring AI)</text>
  <text x="541" y="151" font-size="8" fill="#6b21a8" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">writes llm_calls</text>
  <line x1="606" y1="128" x2="625" y2="128" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- decision -->
  <polygon points="627,128 682,84 737,128 682,172" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="682" y="124" font-size="10" font-weight="bold" fill="#c2410c" text-anchor="middle">Tool</text>
  <text x="682" y="138" font-size="10" font-weight="bold" fill="#c2410c" text-anchor="middle">calls?</text>

  <line x1="737" y1="128" x2="796" y2="128" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="766" y="120" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">no</text>

  <rect x="800" y="98" width="136" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="868" y="125" font-size="10.5" font-weight="bold" fill="#166534" text-anchor="middle">Final response</text>
  <text x="868" y="142" font-size="8.5" fill="#15803d" text-anchor="middle">returned to user</text>

  <!-- yes branch -->
  <line x1="682" y1="172" x2="682" y2="282" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="692" y="230" font-size="9" font-weight="bold" fill="#ea580c">yes</text>

  <!-- ════ tool loop (right → left) ════ -->
  <rect x="632" y="286" width="124" height="60" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.2"/>
  <text x="694" y="312" font-size="10" font-weight="bold" fill="#c2410c" text-anchor="middle">ToolExecutor</text>
  <text x="694" y="329" font-size="8.5" fill="#9a3412" text-anchor="middle">resolve + invoke</text>
  <line x1="630" y1="316" x2="612" y2="316" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="468" y="286" width="140" height="60" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.2"/>
  <text x="538" y="310" font-size="10" font-weight="bold" fill="#c2410c" text-anchor="middle">SandboxChecker</text>
  <text x="538" y="326" font-size="8.5" fill="#9a3412" text-anchor="middle">path · command · domain</text>
  <text x="538" y="339" font-size="8.5" fill="#9a3412" text-anchor="middle">whitelists</text>
  <line x1="466" y1="316" x2="448" y2="316" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="292" y="286" width="152" height="60" rx="8" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.2"/>
  <text x="368" y="310" font-size="10" font-weight="bold" fill="#7e22ce" text-anchor="middle">Execute Tool</text>
  <text x="368" y="326" font-size="8.5" fill="#6b21a8" text-anchor="middle">builtin in-process</text>
  <text x="368" y="339" font-size="8.5" fill="#6b21a8" text-anchor="middle">MCP JSON-RPC</text>

  <text x="538" y="364" font-size="8" fill="#9ca3af" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">writes tool_invocations (audit)</text>

  <!-- loop back up -->
  <line x1="368" y1="284" x2="368" y2="166" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="358" y="216" font-size="8.5" fill="#c2410c" text-anchor="end">tool result appended</text>
  <text x="358" y="229" font-size="8.5" fill="#c2410c" text-anchor="end">next iteration</text>

  <!-- guard -->
  <rect x="24" y="380" width="310" height="34" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="42" cy="397" r="4" fill="#ea580c"/>
  <text x="52" y="401" font-size="9" fill="#4b5563">Loop guard · max_iterations (default 10) forces stop</text>

  <text x="480" y="432" font-size="8.5" fill="#9ca3af" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">every LLM call and tool invocation is persisted — audit tables in SQLite, full history in session messages</text>
</svg>
